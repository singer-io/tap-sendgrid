version: 2
jobs:
  build:
    docker:
      - image: 218546966473.dkr.ecr.us-east-1.amazonaws.com/circle-ci:stitch-tap-tester-uv
    steps:
      - checkout
      - run:
          name: 'Setup virtual env'
          command: |
            uv venv --python 3.12 /usr/local/share/virtualenvs/tap-sendgrid
            source /usr/local/share/virtualenvs/tap-sendgrid/bin/activate
            uv pip install -U setuptools
            uv pip install .[dev]
      - add_ssh_keys
      - run:
          name: 'JSON Validator'
          command: |
            source /usr/local/share/virtualenvs/tap-sendgrid/bin/activate
            stitch-validate-json tap_sandgrid/schemas/*.json
      - run:
          name: 'pylint'
          command: |
            source /usr/local/share/virtualenvs/tap-sendgrid/bin/activate
            uv pip install pylint
            pylint tap_sendgrid -d C,R,W
      - run:
          name: 'Unit Tests'
          command: |
            source /usr/local/share/virtualenvs/tap-sandgrid/bin/activate
            uv pip install pytest coverage parameterized
            coverage run -m pytest tests/unittests
            coverage html
          when: always
workflows:
  version: 2
  commit:
    jobs:
      - build:
          context: circleci-user
